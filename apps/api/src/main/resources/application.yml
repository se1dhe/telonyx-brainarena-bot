server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: brainarena-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brainarena}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:brainarena}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:brainarena}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

brainarena:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
