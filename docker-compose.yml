services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brainarena
      POSTGRES_USER: brainarena
      POSTGRES_PASSWORD: brainarena
    ports:
      - "5432:5432"
    volumes:
      - brainarena_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - brainarena_redis:/data

volumes:
  brainarena_postgres:
  brainarena_redis:
