pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'telonyx-brainarena-bot'

include 'apps:api'
include 'apps:bot'
include 'packages:common'
include 'packages:domain'
include 'packages:persistence'
include 'packages:security'
include 'packages:integration'
include 'packages:analytics'
